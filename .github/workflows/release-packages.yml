# Builds the .rpm, .deb and Arch package for a release and attaches them, with
# a PKGBUILD that builds the release from source, to the GitHub release.
#
# Runs when a tag v<VERSION> is pushed (fingerprint-repo-gui's Release does
# this) — the release is then created here, with the CHANGELOG.md section as its
# notes — or when a release is published on GitHub, or by hand for an existing
# tag: Actions → Release packages → Run workflow.
# The .rpm and .deb are built once per supported release, on that release:
# their library dependencies come from the system they're built on, and
# distros rename library packages between releases (Ubuntu 26.04: libgusb2 →
# libgusb2a). The file names say which release each is for (.fc45,
# ~ubuntu26.04, ~debian13). Mint uses its Ubuntu base's .deb, MX its Debian
# base's. Arch is rolling: one package.

name: Release packages

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.0.1"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}

# A release made on GitHub with a new tag also pushes that tag: the second run
# waits for the first and re-attaches the same files.
concurrency:
  group: release-packages-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match VERSION ($version): raise VERSION, or tag v$version."
            exit 1
          fi

  rpm:
    name: rpm (Fedora ${{ matrix.fedora }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        fedora: ["44", "45"]
    container: fedora:${{ matrix.fedora }}
    steps:
      - run: >
          dnf -y install git rpm-build gcc gcc-c++ meson ninja-build patch tar gzip curl
          glib2-devel libgusb-devel openssl-devel systemd-rpm-macros
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash packaging/rpm/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-fedora${{ matrix.fedora }}
          path: packaging/out/*.rpm
          if-no-files-found: error

  deb:
    name: deb (${{ matrix.image }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13"]
    container: ${{ matrix.image }}
    steps:
      - run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates curl build-essential debhelper meson ninja-build patch \
            pkgconf libglib2.0-dev libgusb-dev libssl-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: bash packaging/debian/build.sh
      - name: Name the artifact
        run: echo "ARTIFACT=deb-$(echo '${{ matrix.image }}' | tr ':' '-')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: packaging/out/*.deb
          if-no-files-found: error

  arch:
    name: Arch package and PKGBUILD
    needs: check
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # The package's dependencies are installed here, so makepkg (which
      # refuses to run as root) can build as a plain user with --nodeps.
      - run: >
          pacman -Syu --noconfirm --needed git meson ninja pkgconf glib2-devel patch
          fprintd libfprint glib2 libgusb openssl bash systemd usbutils libnotify polkit
          python python-gobject python-cairo gtk3
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Build the package
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg --nodeps --noconfirm"
          mkdir -p dist
          mv packaging/arch/*.pkg.tar.zst dist/
      - name: Write the release PKGBUILD
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          driver=$(grep -v '^#' DRIVER | tr -d '[:space:]')
          # The release tarball's checksum: only downloadable once the repository is public.
          if curl -fsSL -o release.tar.gz "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"; then
            sha=$(sha256sum release.tar.gz | cut -d' ' -f1)
          else
            echo "::warning::Release tarball not downloadable (private repository?) — PKGBUILD uses SKIP"
            sha=SKIP
          fi
          sed -e "s/@VERSION@/$version/g" -e "s/@DRIVER@/$driver/g" -e "s/@SHA256@/$sha/g" \
            packaging/arch/PKGBUILD.release.in > dist/PKGBUILD
          cp packaging/arch/fingerprint-fix-sdcp.install dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attach to the release
    needs: [rpm, deb, arch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A pushed tag has no release yet: make one, titled with the version and
      # with this version's CHANGELOG.md section as its notes.
      - name: Create the release if needed
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG exists"
          else
            awk -v h="## $version" 'index($0, h " ") == 1 || $0 == h { f = 1; next }
                                    f && /^## / { exit } f' CHANGELOG.md > notes.md
            [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "$version" --notes-file notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      # GitHub turns the '~' in a .deb's name into '.' on upload: do it here, so
      # SHA256SUMS lists the names the release really has. The Fingerprint
      # Manager reads SHA256SUMS to find and check this system's package.
      - name: Name the files as GitHub will, and list their checksums
        run: |
          cd dist
          for f in *~*; do [ -e "$f" ] && mv -- "$f" "${f//\~/.}"; done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - run: |
          ls -l dist
          gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
